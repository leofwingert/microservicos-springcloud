spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: pecas-route
          uri: lb://pecas-service
          predicates:
            - Path=/api/pecas/**
        - id: clientes-route
          uri: lb://clientes-service
          predicates:
            - Path=/api/clientes/**
        - id: representantes-route
          uri: lb://representantes-service
          predicates:
            - Path=/api/representantes/**

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
